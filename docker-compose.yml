version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: vietcraft-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: vietcraft
    volumes:
      - mongodb_data:/data/db
    networks:
      - vietcraft-network

  # Backend REST API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: vietcraft-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/vietcraft
      - JWT_SECRET=vietcraft_production_secret_key_change_me
      - JWT_REFRESH_SECRET=vietcraft_production_refresh_key_change_me
      - CLIENT_URL=http://localhost:5173
      - ADMIN_URL=http://localhost:5174
      - AMAZON_ASSOCIATE_TAG=vietcraft-20
    depends_on:
      - mongodb
    volumes:
      - api_uploads:/app/apps/api/uploads
    networks:
      - vietcraft-network

  # Public Website
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: vietcraft-web
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - api
    networks:
      - vietcraft-network

  # Admin CMS Dashboard
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: vietcraft-admin
    restart: unless-stopped
    ports:
      - '5174:80'
    depends_on:
      - api
    networks:
      - vietcraft-network

volumes:
  mongodb_data:
  api_uploads:

networks:
  vietcraft-network:
    driver: bridge
